<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tutorial Test</title>
<style>
body { 
  margin: 40px;
  background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%); 
  font-family: Arial;
}
.start-btn {
  display: block;
  margin: 10px;
  padding: 20px;
  background: #fff;
  border: 2px solid #000;
  cursor: pointer;
  font-size: 18px;
}
.start-divider {
  margin: 20px 0;
  padding: 10px;
  background: #fff;
  text-align: center;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>GRÜNER TEST - Tutorial Fix</h1>

<button class="start-btn start-btn-primary">Button 1 - Training</button>
<button class="start-btn start-btn-3darts">Button 2 - Checkouts</button>
<button class="start-btn start-btn-leaderboard">Button 3 - Bestenliste</button>
<div class="start-divider">Weitere Optionen</div>
<button class="start-btn start-btn-tutorial" onclick="testTutorial()">Button 4 - Bloß nicht drücken!</button>

<div id="result" style="margin-top: 30px; padding: 20px; background: white; border: 2px solid black;"></div>

<script>
function testTutorial() {
  const resultDiv = document.getElementById('result');
  
  // Test 1: Finde Button mit .start-btn-tutorial
  const btn1 = document.querySelector('.start-btn-tutorial');
  
  // Test 2: Finde Button mit :nth-child(4)
  const btn2 = document.querySelector('.start-btn:nth-child(4)');
  
  // Test 3: Finde Button mit :nth-child(5) (wegen divider)
  const btn3 = document.querySelector('.start-btn:nth-child(5)');
  
  resultDiv.innerHTML = `
    <h2>Test Ergebnisse:</h2>
    <p><strong>Test 1 - .start-btn-tutorial:</strong><br>
    ${btn1 ? '✅ GEFUNDEN: ' + btn1.textContent : '❌ NICHT GEFUNDEN'}</p>
    
    <p><strong>Test 2 - .start-btn:nth-child(4):</strong><br>
    ${btn2 ? '✅ GEFUNDEN: ' + btn2.textContent : '❌ NICHT GEFUNDEN (Korrekt! Child 4 ist der Divider)'}</p>
    
    <p><strong>Test 3 - .start-btn:nth-child(5):</strong><br>
    ${btn3 ? '✅ GEFUNDEN: ' + btn3.textContent : '❌ NICHT GEFUNDEN'}</p>
    
    <p style="margin-top: 20px; color: green; font-weight: bold;">
    ➡️ Der richtige Selektor ist: <code>.start-btn-tutorial</code>
    </p>
  `;
}
</script>

</body>
</html>
